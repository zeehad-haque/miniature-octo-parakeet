name: Secure RDP + Runner Speed Test

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $tsVersion = '1.82.0'
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-$tsVersion-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale-$tsVersion.msi"

          Write-Host "Downloading Tailscale $tsVersion..."
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Write-Host "Installing Tailscale..."
          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i",
              $installerPath,
              "/quiet",
              "/norestart"
            ) `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed."
          }

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            throw "Tailscale executable was not found: $tsExe"
          }

          Write-Host ""
          Write-Host "=== TAILSCALE VERSION ==="
          & $tsExe version


      # ============================================================
      # 2. CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            throw "Tailscale executable not found."
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY GitHub Secret is missing."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       TAILSCALE SERVICE CHECK"
          Write-Host "========================================"

          $service = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue

          if (-not $service) {
            throw "Tailscale Windows service was not found."
          }

          Write-Host "Service status: $($service.Status)"

          if ($service.Status -ne "Running") {
            Write-Host "Starting Tailscale service..."
            Start-Service -Name "Tailscale"
            Start-Sleep -Seconds 5
          }

          $service = Get-Service -Name "Tailscale"

          Write-Host "Service status now: $($service.Status)"

          if ($service.Status -ne "Running") {
            throw "Tailscale service is not running."
          }

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       CONNECTING TO TAILSCALE"
          Write-Host "========================================"
          Write-Host "Hostname: $hostname"

          & $tsExe up `
            --authkey="$env:TS_AUTH_KEY" `
            --hostname="$hostname" `
            --unattended=true `
            --accept-dns=false

          $upExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "tailscale up exit code: $upExitCode"

          if ($upExitCode -ne 0) {
            Write-Host ""
            Write-Host "=== TAILSCALE STATUS AFTER FAILURE ==="
            & $tsExe status

            Write-Host ""
            Write-Host "=== TAILSCALE IP ==="
            & $tsExe ip -4

            throw "tailscale up failed with exit code $upExitCode."
          }

          Write-Host ""
          Write-Host "=== TAILSCALE STATUS ==="
          & $tsExe status

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

            $candidate = (
              & $tsExe ip -4 2>$null |
              Select-Object -First 1
            )

            if ($candidate) {

              $candidate = $candidate.ToString().Trim()

              if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
                $tsIP = $candidate
                break
              }
            }

            Write-Host "Waiting for Tailscale IPv4... attempt $i/20"
            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {

            Write-Host ""
            Write-Host "=== FINAL TAILSCALE STATUS ==="
            & $tsExe status

            Write-Host ""
            Write-Host "=== FINAL TAILSCALE IP ==="
            & $tsExe ip -4

            throw "Tailscale IPv4 address was not assigned."
          }

          "TAILSCALE_IP=$tsIP" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host ""
          Write-Host "========================================"
          Write-Host "      TAILSCALE CONNECTION SUCCESS"
          Write-Host "========================================"
          Write-Host "Hostname: $hostname"
          Write-Host "IPv4:     $tsIP"
          Write-Host "========================================"


      # ============================================================
      # 3. CONFIGURE RDP
      # ============================================================
      - name: Configure Remote Desktop
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD GitHub Secret is missing."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       CONFIGURING REMOTE DESKTOP"
          Write-Host "========================================"

          # Detect the account running the GitHub job.
          $currentIdentity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $rdpUser = ($currentIdentity -split '\\')[-1]

          Write-Host "Current Windows account: $rdpUser"

          $localUser = Get-LocalUser `
            -Name $rdpUser `
            -ErrorAction SilentlyContinue

          if (-not $localUser) {
            throw "Current local user '$rdpUser' was not found."
          }

          # --------------------------------------------------------
          # Set password from GitHub Secret.
          # IMPORTANT: never print the password.
          # --------------------------------------------------------
          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          Set-LocalUser `
            -Name $rdpUser `
            -Password $securePassword `
            -PasswordNeverExpires $true

          Write-Host "RDP password configured from GitHub Secret."

          # --------------------------------------------------------
          # Add the existing runner account to Remote Desktop Users.
          # --------------------------------------------------------
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $rdpUser `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Enable Remote Desktop.
          # --------------------------------------------------------
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # --------------------------------------------------------
          # Disable Network Level Authentication.
          # --------------------------------------------------------
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          # --------------------------------------------------------
          # Use RDP security layer.
          # --------------------------------------------------------
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 0 `
            -Force

          # --------------------------------------------------------
          # Standard RDP port.
          # --------------------------------------------------------
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'PortNumber' `
            -Value 3389 `
            -Force

          # --------------------------------------------------------
          # Allow connections from all network adapters.
          # --------------------------------------------------------
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'LanAdapter' `
            -Value 0 `
            -Force

          # --------------------------------------------------------
          # Configure Remote Desktop service.
          # --------------------------------------------------------
          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

          Start-Sleep -Seconds 5

          # --------------------------------------------------------
          # Remove old temporary firewall rules.
          # --------------------------------------------------------
          Get-NetFirewallRule `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.DisplayName -like "RDP-Tailscale-*"
            } |
            Remove-NetFirewallRule `
              -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Locate Tailscale adapter.
          # --------------------------------------------------------
          $tsAdapter = Get-NetAdapter |
            Where-Object {
              $_.Status -eq "Up" -and (
                $_.Name -like "*Tailscale*" -or
                $_.InterfaceDescription -like "*Tailscale*"
              )
            } |
            Select-Object -First 1

          if (-not $tsAdapter) {

            Write-Host ""
            Write-Host "Available network adapters:"
            Get-NetAdapter |
              Format-Table -AutoSize

            throw "Tailscale network adapter was not found."
          }

          Write-Host "Tailscale adapter: $($tsAdapter.Name)"

          # --------------------------------------------------------
          # RDP TCP over Tailscale only.
          # --------------------------------------------------------
          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -InterfaceAlias $tsAdapter.Name `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          # --------------------------------------------------------
          # RDP UDP over Tailscale only.
          # --------------------------------------------------------
          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" `
            -Direction Inbound `
            -Action Allow `
            -Protocol UDP `
            -LocalPort 3389 `
            -InterfaceAlias $tsAdapter.Name `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          # --------------------------------------------------------
          # Verify TermService.
          # --------------------------------------------------------
          $termService = Get-Service -Name "TermService"

          Write-Host ""
          Write-Host "TermService status: $($termService.Status)"
          Write-Host "TermService startup: $($termService.StartType)"

          if ($termService.Status -ne "Running") {
            throw "TermService is not running."
          }

          # --------------------------------------------------------
          # Verify TCP 3389 is listening.
          # --------------------------------------------------------
          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "TCP port 3389 is not listening."
          }

          Write-Host ""
          Write-Host "=== TCP 3389 LISTENER ==="

          $listener |
            Select-Object LocalAddress, LocalPort, State |
            Format-Table -AutoSize

          # Save username for later steps.
          "RDP_USER=$rdpUser" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       RDP CONFIGURATION COMPLETE"
          Write-Host "========================================"
          Write-Host "Username: $rdpUser"
          Write-Host "Password: stored in GitHub Secret"
          Write-Host "Port:     3389"
          Write-Host "========================================"


      # ============================================================
      # 4. VERIFY LOCAL RDP LISTENER
      # ============================================================
      - name: Verify RDP Listener
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       RDP LISTENER VERIFICATION"
          Write-Host "========================================"

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "RDP Port:     3389"

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "TCP 3389 is not listening."
          }

          Write-Host ""
          Write-Host "TCP 3389 is LISTENING."

          $listener |
            Select-Object LocalAddress, LocalPort, State |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "IMPORTANT:"
          Write-Host "This verifies the runner's local RDP listener."
          Write-Host "Your PC must test the Tailscale connection separately."


      # ============================================================
      # 5. INSTALL / RUN OOKLA SPEEDTEST CLI
      # ============================================================
      - name: Measure Runner Internet Speed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $speedVersion = '1.2.0'

          $speedUrl = `
            "https://install.speedtest.net/app/cli/ookla-speedtest-$speedVersion-win64.zip"

          $zipPath = Join-Path `
            $env:TEMP `
            "ookla-speedtest-$speedVersion.zip"

          $speedDir = Join-Path `
            $env:TEMP `
            "ookla-speedtest"

          Remove-Item `
            $zipPath `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $speedDir `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $speedDir `
            -Force |
            Out-Null

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       RUNNER INTERNET SPEED TEST"
          Write-Host "========================================"

          Write-Host "Downloading official Ookla Speedtest CLI..."

          Invoke-WebRequest `
            -Uri $speedUrl `
            -OutFile $zipPath

          Write-Host "Extracting Speedtest CLI..."

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $speedDir `
            -Force

          $speedExe = Join-Path `
            $speedDir `
            "speedtest.exe"

          if (-not (Test-Path $speedExe)) {
            throw "speedtest.exe was not found."
          }

          Write-Host "Running Speedtest..."
          Write-Host ""

          $raw = & $speedExe `
            --accept-license `
            --accept-gdpr `
            --progress=no `
            --format=json 2>&1

          $speedExitCode = $LASTEXITCODE

          if ($speedExitCode -ne 0) {
            Write-Host "Speedtest raw output:"
            $raw |
              ForEach-Object {
                Write-Host $_
              }

            throw "Speedtest failed with exit code $speedExitCode."
          }

          $jsonText = ($raw | Out-String).Trim()

          try {
            $result = $jsonText | ConvertFrom-Json
          }
          catch {
            Write-Host "Raw Speedtest output:"
            Write-Host $jsonText

            throw "Could not parse Speedtest JSON."
          }

          # Ookla bandwidth values are bytes/second.
          $downloadMbps = [math]::Round(
            ([double]$result.download.bandwidth * 8) / 1000000,
            2
          )

          $uploadMbps = [math]::Round(
            ([double]$result.upload.bandwidth * 8) / 1000000,
            2
          )

          $downloadGbps = [math]::Round(
            $downloadMbps / 1000,
            3
          )

          $uploadGbps = [math]::Round(
            $uploadMbps / 1000,
            3
          )

          $pingMs = [math]::Round(
            [double]$result.ping.latency,
            2
          )

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       ACTUAL RUNNER SPEED"
          Write-Host "========================================"
          Write-Host "ISP:          $($result.isp)"
          Write-Host "Server:       $($result.server.name)"
          Write-Host "Location:     $($result.server.location)"
          Write-Host "Ping:         $pingMs ms"
          Write-Host "Download:     $downloadMbps Mbps"
          Write-Host "Download:     $downloadGbps Gbps"
          Write-Host "Upload:       $uploadMbps Mbps"
          Write-Host "Upload:       $uploadGbps Gbps"
          Write-Host "Packet Loss:  $($result.packetLoss)%"
          Write-Host "========================================"

          try {
            $publicIp = (
              Invoke-RestMethod `
                -Uri "https://api.ipify.org"
            ).ToString().Trim()

            Write-Host "Runner Public IPv4: $publicIp"
          }
          catch {
            Write-Host "Could not determine runner public IPv4."
          }

          Write-Host ""
          Write-Host "THESE VALUES WERE MEASURED INSIDE THE GITHUB RUNNER."


      # ============================================================
      # 6. SHOW RDP INFORMATION WITHOUT PASSWORD
      # ============================================================
      - name: Show RDP Access Information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "             RDP ACCESS"
          Write-Host "========================================"
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: .\$env:RDP_USER"
          Write-Host "Password: stored in GitHub Secret"
          Write-Host ""
          Write-Host "Run this on your own Windows PC:"
          Write-Host ""
          Write-Host "mstsc /v:$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "========================================"


      # ============================================================
      # 7. KEEP RUNNER ALIVE
      # ============================================================
      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP SESSION ACTIVE"
          Write-Host "========================================"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "RDP User:     $env:RDP_USER"
          Write-Host ""
          Write-Host "Cancel the GitHub workflow when finished."
          Write-Host "========================================"

          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP/Tailscale active..."
            Start-Sleep -Seconds 300
          }


      # ============================================================
      # 8. CLEANUP
      # ============================================================
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          Write-Host ""
          Write-Host "========================================"
          Write-Host "                CLEANUP"
          Write-Host "========================================"

          # Remove temporary firewall rules.
          Get-NetFirewallRule |
            Where-Object {
              $_.DisplayName -like "RDP-Tailscale-*"
            } |
            Remove-NetFirewallRule

          # Disconnect Tailscale.
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $tsExe) {
            & $tsExe logout
          }

          Write-Host "Cleanup complete."
